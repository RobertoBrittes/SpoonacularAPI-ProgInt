<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geladeira Aberta – receitas pelos ingredientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>O que tem na geladeira hoje?</h1>
    <p class="lead">Digite os ingredientes que você tem em casa e veja receitas que dá para fazer agora.</p>

    <form id="search-form" novalidate>
      <label for="ingredient-input">Ingrediente (em inglês)</label>
      <div class="input-row">
        <input id="ingredient-input" type="text" placeholder="ex.: chicken, tomato, rice" autocomplete="off">
        <button type="button" id="add-btn" class="btn-secondary">Adicionar</button>
      </div>

      <ul id="chips" class="chips" aria-label="Ingredientes escolhidos"></ul>

      <div class="suggestions" id="suggestions">
        <span>Sugestões:</span>
      </div>

      <button type="submit" id="search-btn" class="btn-primary">Buscar receitas</button>
    </form>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" class="grid" aria-label="Receitas encontradas"></section>
  </main>

  <dialog id="recipe-dialog">
    <button type="button" id="close-dialog" class="close" aria-label="Fechar">×</button>
    <div id="dialog-body"></div>
  </dialog>

  <footer>Dados fornecidos pela <a href="https://spoonacular.com/food-api" target="_blank" rel="noopener">Spoonacular API</a></footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
